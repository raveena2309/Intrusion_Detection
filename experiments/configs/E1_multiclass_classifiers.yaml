# E1: Multiclass Classifier Comparison
# Experiment: Random Forest vs XGBoost on UNSW-NB15 (10-class)
experiment_id: E1
name: Multiclass Classifier Comparison
description: >
  Train and evaluate Random Forest and XGBoost classifiers on
  the UNSW-NB15 dataset for 10-class attack categorization.

dataset:
  name: UNSW-NB15
  train_file: datasets/raw/UNSW_NB15_training-set.csv
  test_file: datasets/raw/UNSW_NB15_testing-set.csv
  train_samples: 175341
  test_samples: 82332
  num_classes: 10
  classes:
    - Analysis
    - Backdoor
    - DoS
    - Exploits
    - Fuzzers
    - Generic
    - Normal
    - Reconnaissance
    - Shellcode
    - Worms

preprocessing:
  excluded_columns: [id, label, attack_cat]
  categorical_features: [proto, service, state]
  encoding: ordinal
  scaling: standard
  nan_strategy: median
  inf_replacement: column_max
  num_features: 42
  fit_on: train_only

models:
  random_forest:
    n_estimators: 100
    random_state: 42
    n_jobs: -1
    max_features: sqrt
  xgboost:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.3
    random_state: 42
    tree_method: hist
    objective: multi:softprob
    num_class: 10
    eval_metric: mlogloss

evaluation:
  metrics:
    - accuracy
    - macro_f1
    - weighted_f1
    - per_class_precision_recall_f1
  split: predefined_train_test

random_seed: 42
run_date: "2026-11-08"
script: experiments/train_classifiers.py
